  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
};
const show = (html) => { document.open(); document.write(html); document.close(); };
const store = { get() { try { return localStorage.getItem('gym-pw'); } catch (e) { return null; } },
  set(v) { try { v ? localStorage.setItem('gym-pw', v) : localStorage.removeItem('gym-pw'); } catch (e) {} } };
(async () => { const saved = store.get(); if (saved) { try { show(await unlock(saved)); } catch (e) { store.set(null); } } })();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, msg = document.getElementById('msg');
  msg.textContent = 'Unlocking...';
  try { const html = await unlock(pw); store.set(document.getElementById('keep').checked ? pw : null); show(html); }
  catch (err) { msg.textContent = 'Wrong password.'; }
});
}
